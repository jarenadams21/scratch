# Production Configuration Template
# Copy this to flags.yml and update with your values before deploying

dev:
  enabled: false  # MUST be false in production
  description: "Development mode with mock authentication and data"
  mock_user: "admin@harbinger.dev"
  mock_token: "mock-dev-token-12345"
  simulated_delay_ms: 0

debug:
  enabled: false  # Set to true only for debugging production issues
  description: "Enable detailed console logging"

verbose:
  enabled: false
  description: "Enable verbose output for all operations"

logging:
  log_level: "INFO"  # Options: DEBUG, INFO, WARN, ERROR
  log_to_console: true
  log_messages: false  # Set false in production for performance
  description: "Configure application-wide logging behavior"

api:
  base_url: "https://api.yourdomain.com"  # UPDATE THIS - Your backend URL
  timeout_ms: 30000
  retry_attempts: 3
  description: "Backend API connection settings"

ui:
  show_dev_badges: false  # Hide DEV badges in production
  auto_save_interval_ms: 60000
  max_title_length: 100
  max_content_length: 10000
  description: "User interface behavior settings"

database:
  table_name: "journal-app-prod"  # Use different table for production
  region: "us-east-1"  # UPDATE THIS - Your AWS region
  description: "DynamoDB connection settings"

auth:
  jwt_expires_in: "7d"
  require_email_verification: false  # Set true when email service is configured
  description: "Authentication configuration"
