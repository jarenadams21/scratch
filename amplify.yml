version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        - cd frontend && npm ci
        - cd ..
        - |
          cat > frontend/src/config/flags-runtime.js << TEMPLATE
          export const CONFIG = {
            DEV:        false,
            API_URL:    '$API_URL',
            MOCK_USER:  '',
            MOCK_TOKEN: '',
            DEV_DELAY:  0,
          };
          export function devLog() {}
          TEMPLATE
        - npm run build:prod
  artifacts:
    baseDirectory: frontend/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - frontend/node_modules/**/*
