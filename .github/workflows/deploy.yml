name: Deploy Harbinger

on:
  push:
    branches:
      - main
      - proto

jobs:
  deploy-frontend:
    name: Deploy Frontend to Hosting Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          cd frontend && npm ci

      - name: Load production config
        run: |
          echo 'Flags disabled'

      - name: Build frontend
        run: |
          cd frontend
          npm run build:prod
