# Cloudflare Pages configuration
# This file is optional - Cloudflare auto-detects most settings

# Build settings
[build]
  command = "npm run build"
  publish = "dist"

# Environment variables (set these in Cloudflare dashboard)
[env.production]
  NODE_ENV = "production"

# Redirects and headers
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
